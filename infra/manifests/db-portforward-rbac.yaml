apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-portforward
  namespace: fair
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-portforward
  namespace: fair
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-portforward
  namespace: fair
subjects:
  - kind: ServiceAccount
    name: db-portforward
    namespace: fair
roleRef:
  kind: Role
  name: db-portforward
  apiGroup: rbac.authorization.k8s.io
